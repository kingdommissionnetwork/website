# This wrangler.toml is for backend-only local dev.
# Production deploys as a Cloudflare Worker with static assets
# via the root wrangler.toml (main = "backend/src/index.ts").
name = "hkn-api-dev"
main = "src/index.ts"
compatibility_date = "2025-03-01"

[vars]
SUPABASE_URL = ""
SUPABASE_SERVICE_KEY = ""
